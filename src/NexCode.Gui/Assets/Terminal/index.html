<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NexCode Terminal</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #0c0c0c; }
  #term { width: 100%; height: 100%; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
</head>
<body>
<div id="term"></div>
<script>
(function () {
  function post(msg) {
    try { window.chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) { /* ignore */ }
  }

  if (!window.Terminal) {
    document.getElementById('term').innerText = 'xterm.js failed to load (offline). Bundled assets arrive in Slice 0018.';
    post({ type: 'error', error: 'xterm_unavailable' });
    return;
  }

  const term = new Terminal({
    convertEol: false,
    cursorBlink: true,
    theme: { background: '#0c0c0c', foreground: '#cccccc' },
    fontFamily: 'Cascadia Mono, Consolas, monospace',
    fontSize: 14
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  try { fit.fit(); } catch (e) {}

  term.onData((data) => {
    post({ type: 'input', data: data });
  });

  function applyResize() {
    try { fit.fit(); } catch (e) {}
    post({ type: 'resize', cols: term.cols, rows: term.rows });
  }

  window.addEventListener('resize', applyResize);

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', (ev) => {
      let msg = ev.data;
      if (typeof msg === 'string') {
        try { msg = JSON.parse(msg); } catch (e) { return; }
      }
      if (!msg || !msg.type) return;
      switch (msg.type) {
        case 'output':
          if (typeof msg.data === 'string') term.write(msg.data);
          break;
        case 'clear': term.clear(); break;
        case 'fit': applyResize(); break;
        default: break;
      }
    });
  }

  post({ type: 'ready', cols: term.cols, rows: term.rows });
})();
</script>
</body>
</html>
