name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore
        run: dotnet restore NexCode.slnx

      - name: Build
        run: dotnet build NexCode.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NexCode.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Publish GUI (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish src\NexCode.Gui\NexCode.Gui.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=false `
            -o publish-output

      - name: Build MSIX package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path msix-output -Force | Out-Null
          dotnet msbuild src\NexCode.Gui\NexCode.Gui.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageDir=$(Resolve-Path .\msix-output)\

      - name: Generate OSS license inventory
        shell: pwsh
        run: .\scripts\build\Generate-OssLicenses.ps1

      - name: Decode signing certificate
        if: ${{ env.SIGNING_CERTIFICATE_PFX != '' }}
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'nexcode-signing-cert.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign MSIX package
        if: ${{ env.SIGNING_CERTIFICATE_PFX != '' }}
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          .\scripts\build\Sign-Msix.ps1 `
            -PackageDirectory .\msix-output `
            -CertificatePath $env:PFX_PATH `
            -CertificatePassword $env:SIGNING_CERTIFICATE_PASSWORD

      - name: Stage release assets and compute SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $packages = Get-ChildItem .\msix-output -Recurse -Include *.msix,*.appx -ErrorAction SilentlyContinue
          foreach ($pkg in $packages) {
            Copy-Item -LiteralPath $pkg.FullName -Destination .\release-assets -Force
            $hash = (Get-FileHash $pkg.FullName -Algorithm SHA256).Hash
            "$hash  $($pkg.Name)" | Out-File -FilePath ".\release-assets\$($pkg.Name).sha256" -Encoding utf8
            "$hash  $($pkg.Name)" | Out-File -FilePath .\release-assets\SHA256SUMS.txt -Append -Encoding utf8
          }

          $setup = Get-ChildItem .\publish-output -Recurse -Filter Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item -LiteralPath $setup.FullName -Destination .\release-assets -Force
            $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
            "$hash  Setup.exe" | Out-File -FilePath .\release-assets\Setup.exe.sha256 -Encoding utf8
            "$hash  Setup.exe" | Out-File -FilePath .\release-assets\SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
