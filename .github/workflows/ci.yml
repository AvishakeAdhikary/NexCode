name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-solution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore NexCode.slnx

      - name: Build
        run: dotnet build NexCode.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test NexCode.slnx --configuration Release --no-build --logger trx

      - name: Validate docs skeleton
        shell: pwsh
        run: |
          $required = @(
            'docs/_config.yml',
            'docs/index.md',
            'docs/privacy-policy.md',
            'docs/terms-of-service.md',
            'docs/terms-and-conditions.md',
            'docs/support.md',
            'docs/oss-licenses.md',
            'docs/changelog.md',
            'docs/cookie-policy.md'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            throw "Missing required docs: $($missing -join ', ')"
          }
