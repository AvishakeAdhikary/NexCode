name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore
        run: dotnet restore NexCode.slnx

      - name: Build
        run: dotnet build NexCode.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NexCode.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: "**/coverage.cobertura.xml"
          if-no-files-found: ignore

      - name: Validate docs skeleton
        shell: pwsh
        run: |
          $required = @(
            'docs/_config.yml',
            'docs/index.md',
            'docs/privacy-policy.md',
            'docs/terms-of-service.md',
            'docs/terms-and-conditions.md',
            'docs/support.md',
            'docs/oss-licenses.md',
            'docs/changelog.md',
            'docs/cookie-policy.md'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            throw "Missing required docs: $($missing -join ', ')"
          }
