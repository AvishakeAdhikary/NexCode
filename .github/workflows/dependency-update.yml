name: Dependency Update

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Generate dependency report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .github/reports -Force | Out-Null
          "# Dependency update audit`n`nGenerated: $(Get-Date -Format o)`n" | Set-Content .github/reports/dependency-report.md
          "## NuGet outdated`n" | Add-Content .github/reports/dependency-report.md
          dotnet list NexCode.slnx package --outdated | Out-String | Add-Content .github/reports/dependency-report.md
          "`n## npm outdated`n" | Add-Content .github/reports/dependency-report.md
          "No npm workspace is defined yet." | Add-Content .github/reports/dependency-report.md

      - name: Create pull request with dependency report
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/dependency-audit
          commit-message: "chore: update dependency audit report"
          title: "chore: dependency audit report"
          body: "Weekly dependency audit report generated by GitHub Actions."
