name: Dependency Update

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Generate weekly outdated package report
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore solution
        run: dotnet restore NexCode.slnx

      - name: Generate dependency report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .github/reports -Force | Out-Null
          $reportPath = '.github/reports/dependency-report.md'

          "# Dependency update audit" | Set-Content -Path $reportPath -Encoding utf8
          "" | Add-Content -Path $reportPath -Encoding utf8
          "Generated: $(Get-Date -Format o)" | Add-Content -Path $reportPath -Encoding utf8
          "" | Add-Content -Path $reportPath -Encoding utf8
          "## Outdated NuGet packages" | Add-Content -Path $reportPath -Encoding utf8
          "" | Add-Content -Path $reportPath -Encoding utf8

          $jsonPath = Join-Path $env:RUNNER_TEMP 'outdated.json'
          dotnet list NexCode.slnx package --outdated --format json | Out-File -FilePath $jsonPath -Encoding utf8

          if (-not (Test-Path $jsonPath) -or ((Get-Item $jsonPath).Length -eq 0)) {
            "_No outdated package information returned by `dotnet list`._" | Add-Content -Path $reportPath -Encoding utf8
          } else {
            try {
              $report = Get-Content -Raw -Path $jsonPath | ConvertFrom-Json
              $rows = @()
              foreach ($project in $report.projects) {
                foreach ($framework in $project.frameworks) {
                  foreach ($pkg in $framework.topLevelPackages) {
                    $rows += [pscustomobject]@{
                      Project    = (Split-Path $project.path -Leaf)
                      Framework  = $framework.framework
                      Package    = $pkg.id
                      Resolved   = $pkg.resolvedVersion
                      Latest     = $pkg.latestVersion
                    }
                  }
                }
              }

              if ($rows.Count -eq 0) {
                "_All NuGet packages are up to date._" | Add-Content -Path $reportPath -Encoding utf8
              } else {
                "| Project | Framework | Package | Resolved | Latest |" | Add-Content -Path $reportPath -Encoding utf8
                "| --- | --- | --- | --- | --- |" | Add-Content -Path $reportPath -Encoding utf8
                foreach ($row in $rows) {
                  "| $($row.Project) | $($row.Framework) | $($row.Package) | $($row.Resolved) | $($row.Latest) |" |
                    Add-Content -Path $reportPath -Encoding utf8
                }
              }
            } catch {
              "_Failed to parse outdated package report: $($_.Exception.Message)_" | Add-Content -Path $reportPath -Encoding utf8
              "" | Add-Content -Path $reportPath -Encoding utf8
              $fence = [string]::new('`', 3)
              $fence | Add-Content -Path $reportPath -Encoding utf8
              Get-Content -Raw -Path $jsonPath | Add-Content -Path $reportPath -Encoding utf8
              $fence | Add-Content -Path $reportPath -Encoding utf8
            }
          }

      - name: Create pull request with dependency report
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/dependency-audit
          commit-message: "chore(deps): refresh weekly outdated package report"
          title: "chore(deps): weekly outdated package report"
          body: |
            Weekly outdated NuGet package audit generated by GitHub Actions.

            See `.github/reports/dependency-report.md` for the full table of
            packages that have a newer version available.
          labels: dependencies, automated
          add-paths: |
            .github/reports/dependency-report.md
